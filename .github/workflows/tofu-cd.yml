name: tofu-cd

on:
    push:
        branches:
            - infra_cloud_main
            - infra_identity_main

permissions:
    contents: read

jobs:
    build-crocus:
        if: github.ref_name == 'infra_identity_main'
        permissions:
            contents: read
            packages: write
        uses: ./.github/workflows/crocus-publish.yml
        with:
            image: ghcr.io/paul-clavier/crocus:${{ github.sha }}

    deploy-tofu:
        needs: [build-crocus]
        # Run after the publish on identity; still run on cloud (where the
        # publish is skipped). Never apply if the publish actually failed.
        if: ${{ !cancelled() && needs.build-crocus.result != 'failure' }}
        runs-on: ubuntu-latest
        environment: production
        name: deploy-tofu (${{ github.ref_name }})
        # One apply per branch/project at a time; never cancel a running apply.
        concurrency:
            group: tofu-apply-${{ github.ref_name }}
            cancel-in-progress: false
        env:
            PROJECT: ${{ github.ref_name == 'infra_cloud_main' && 'cloud' || 'identity' }}
            # Shared: state backend + civo provider, used by every root.
            AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            CIVO_TOKEN: ${{ secrets.CIVO_TOKEN }}
            TF_VAR_domain: monsieurtis.com
            # Project-specific. Conditionals keep one project's secrets
            # out of the other's runner environment.
            TF_VAR_cloudflare_api_token: ${{ github.ref_name == 'infra_cloud_main' && secrets.CLOUDFLARE_API_TOKEN || '' }}
            TF_VAR_cloudflare_account_id: ${{ github.ref_name == 'infra_cloud_main' && secrets.CLOUDFLARE_ACCOUNT_ID || '' }}
            TF_VAR_cloudflare_zone_id: ${{ github.ref_name == 'infra_cloud_main' && secrets.CLOUDFLARE_ZONE_ID || '' }}
            TF_VAR_admin_ssh_public_key: ${{ github.ref_name == 'infra_cloud_main' && secrets.CIVO_VPS_SSH_PUBLIC_KEY || '' }}
            TAILSCALE_OAUTH_CLIENT_ID: ${{ github.ref_name == 'infra_cloud_main' && secrets.TAILSCALE_OAUTH_CLIENT_ID || '' }}
            TAILSCALE_OAUTH_CLIENT_SECRET: ${{ github.ref_name == 'infra_cloud_main' && secrets.TAILSCALE_OAUTH_CLIENT_SECRET || '' }}
            TAILSCALE_TAILNET: plclavier@gmail.com
            TF_VAR_postgres_password: ${{ github.ref_name == 'infra_identity_main' && secrets.ORY_POSTGRES_PASSWORD || '' }}
            TF_VAR_kratos_cookie_secret: ${{ github.ref_name == 'infra_identity_main' && secrets.KRATOS_COOKIE_SECRET || '' }}
            TF_VAR_kratos_cipher_secret: ${{ github.ref_name == 'infra_identity_main' && secrets.KRATOS_CIPHER_SECRET || '' }}
            TF_VAR_hydra_system_secret: ${{ github.ref_name == 'infra_identity_main' && secrets.HYDRA_SYSTEM_SECRET || '' }}
            TF_VAR_google_oauth_client_id: ${{ github.ref_name == 'infra_identity_main' && secrets.GOOGLE_OAUTH_CLIENT_ID || '' }}
            TF_VAR_google_oauth_client_secret: ${{ github.ref_name == 'infra_identity_main' && secrets.GOOGLE_OAUTH_CLIENT_SECRET || '' }}
            TF_VAR_smtp_connection_uri: ${{ github.ref_name == 'infra_identity_main' && secrets.SMTP_CONNECTION_URI || '' }}
            # Pin the deploy to the immutable image just published by build-crocus.
            TF_VAR_crocus_image: ${{ github.ref_name == 'infra_identity_main' && format('ghcr.io/paul-clavier/crocus:{0}', github.sha) || '' }}
        steps:
            - uses: actions/checkout@v4

            - uses: opentofu/setup-opentofu@v1
              with:
                  tofu_version: 1.9.1
                  tofu_wrapper: false

            - name: tofu init
              working-directory: infra/${{ env.PROJECT }}
              run: tofu init -input=false -lockfile=readonly

            # The cluster firewall accepts traffic only from the exit node's
            # public IP. Route the runner's egress through it via tailnet so the
            # kubernetes/helm/kubectl providers can reach the kube API. Both
            # projects talk to the kube API, so this runs unconditionally.
            # tag:ci devices are ephemeral and deregister when the job ends.
            - name: Tailscale up
              uses: tailscale/github-action@v3
              with:
                  oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
                  oauth-secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
                  tags: tag:ci

            # The cluster firewall accepts traffic only from the exit node's
            # public IP, so all kube API traffic must egress through it.
            # 1. `up` returns once the backend is Running, but the peer netmap (and
            # each peer's exit-node flag) may not have been fully synced, hence `set --exit-node=<name>`
            # indicated an unknown exit node. So retry until the netmap catches up; timeout-minutes bounds it.
            # 2. --exit-node-allow-lan-access keeps LAN/private ranges on the direct
            # route while everything public egresses via the exit node.
            - name: Route kube API traffic through the exit node
              timeout-minutes: 2
              run: until sudo tailscale set --exit-node=monsieurtis-exit --exit-node-allow-lan-access; do sleep 2; done

            - name: tofu plan
              working-directory: infra/${{ env.PROJECT }}
              run: tofu plan -input=false -out=tfplan

            - name: tofu apply
              working-directory: infra/${{ env.PROJECT }}
              run: tofu apply -input=false tfplan
