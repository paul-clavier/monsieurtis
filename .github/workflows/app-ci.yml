name: app-ci

on:
    pull_request:
        branches:
            - main

permissions:
    contents: read

concurrency:
    group: app-ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    # Repo-wide checks: formatting, generated files (Dockerfile COPY lists, bun
    # version pins) up to date, shared dependencies going through catalogs.
    repo-checks:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: ./.github/actions/setup-bun
            - run: bunx prettier --ignore-unknown --check .
            - run: bun cli/src/main.ts repo sync --check
            - run: bun cli/src/main.ts repo catalog-check

    # Compute which packages need checking: those that changed, plus everything
    # that transitively depends on them. Same logic as `tis repo affected`.
    detect-apps-checks:
        runs-on: ubuntu-latest
        outputs:
            matrix: ${{ steps.compute.outputs.matrix }}
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0 # full history so `git merge-base` works
            - uses: ./.github/actions/setup-bun
              with:
                  install: "false" # the CLI only uses bun built-ins
            - id: compute
              run: |
                  matrix=$(bun cli/src/main.ts repo affected --json --base "origin/${{ github.base_ref }}")
                  echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
                  echo "Detect apps checks matrix: $matrix"

    quality-ts-checks:
        needs: detect-apps-checks
        if: needs.detect-apps-checks.outputs.matrix != '{"include":[]}'
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix: ${{ fromJson(needs.detect-apps-checks.outputs.matrix) }}
        name: quality-ts-checks (${{ matrix.name }})
        steps:
            - uses: actions/checkout@v4
            - uses: ./.github/actions/setup-bun
            # Run only the checks this package declares, in the order
            # `tis repo affected` listed them (prep steps like prisma:generate first).
            - name: Run checks
              run: |
                  for script in ${{ matrix.scripts }}; do
                    echo "::group::bun run --filter '${{ matrix.name }}' $script"
                    bun run --filter '${{ matrix.name }}' "$script"
                    echo "::endgroup::"
                  done
