services:
    db:
        image: postgres:18-alpine
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: linlin
        ports:
            - "5432:5432"
        volumes:
            - linlin-pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d linlin"]
            interval: 5s
            timeout: 5s
            retries: 10

    server:
        build:
            context: ../../..
            dockerfile: apps/linlin/linlin-server/Dockerfile
            target: dev
        depends_on:
            db:
                condition: service_healthy
        environment:
            DATABASE_URL: postgresql://postgres:postgres@db:5432/linlin?schema=public
            PORT: "8000"
        ports:
            - "8000:8000"
        volumes:
            - ../../..:/app
            - /app/node_modules
            - /app/apps/linlin/linlin-server/node_modules
            - /app/apps/linlin/interfaces/node_modules
            - /app/lib/core/node_modules
            - /app/lib/packages/nest-rest-crud/node_modules
            - /app/lib/packages/prisma/node_modules
            - /app/apps/linlin/linlin-server/src/infrastructure/prisma/generated

volumes:
    linlin-pgdata:
